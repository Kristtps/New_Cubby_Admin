<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - CoinCubby Admin Panel</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script>
        // Apply saved theme synchronously before page renders (prevents white flash)
        (function () {
            const STORAGE_KEY = 'coincubby_theme';
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                const theme = (saved === 'light' || saved === 'dark') ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <style>
        .notifications-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
        }

        .notifications-actions {
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            padding: 10px 20px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background: var(--color-primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            padding: 10px 20px;
            background: var(--color-panel-bg);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-secondary:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: var(--color-primary-bg);
        }

        .notifications-container {
            flex: 1;
            width: 100%;
            min-width: 0;
            min-height: 0;
            max-width: none;
            max-height: none;
            margin: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 8px;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar Styling */
        .notifications-container::-webkit-scrollbar {
            width: 8px;
        }

        .notifications-container::-webkit-scrollbar-track {
            background: var(--color-bg-light);
            border-radius: 10px;
        }

        .notifications-container::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: 10px;
            transition: background 0.2s;
        }

        .notifications-container::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary);
        }

        /* Firefox Scrollbar */
        .notifications-container {
            scrollbar-width: thin;
            scrollbar-color: var(--color-border) var(--color-bg-light);
        }

        /* Dark Mode Scrollbar */
        [data-theme="dark"] .notifications-container::-webkit-scrollbar-track {
            background: var(--dark-bg-primary);
        }

        [data-theme="dark"] .notifications-container::-webkit-scrollbar-thumb {
            background: var(--dark-border);
        }

        [data-theme="dark"] .notifications-container::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary);
        }

        [data-theme="dark"] .notifications-container {
            scrollbar-color: var(--dark-border) var(--dark-bg-primary);
        }

        .notification-item {
            background: var(--color-panel-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s, background-color 0.25s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: none;
        }

        .notification-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        /* ACTIVE / UNREAD STATE */
        .notification-item.unread {
            background: rgba(239, 68, 68, 0.04);
            border-left: 4px solid var(--color-occupied);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.08);
        }

        .notification-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* ICON CONTAINER */
        .notification-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        /* Use existing status colors for icons */
        .icon-feedback { background: var(--gradient-purple); color: white; }
        .icon-customer { background: var(--gradient-info); color: white; }
        .icon-rental { background: var(--gradient-success); color: white; }
        .icon-maintenance { background: var(--gradient-warning); color: white; }
        .icon-warning { background: var(--gradient-danger); color: white; }
        .icon-verification { background: var(--gradient-purple); color: white; }
        .icon-default { background: var(--color-border); color: var(--color-dark); }

        .notification-icon svg {
            stroke: currentColor;
            fill: none;
        }
        
        .notification-icon svg.filled {
            fill: currentColor;
            stroke: none;
        }

        /* Unread/Active Icon Highlight */
        .notification-item.unread .notification-icon {
            background: var(--gradient-danger);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
            color: white;
        }

        .notification-details {
            flex: 1;
            min-width: 0;
        }

        .notification-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        /* TITLE */
        .notification-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-dark);
            line-height: 1.2;
            flex: 1;
            min-width: 0;
        }

        /* MESSAGE */
        .notification-message {
            font-size: 14px;
            color: var(--color-text-muted);
            line-height: 1.4;
            margin-top: 4px;
            margin-bottom: 8px;
        }

        /* DATETIME */
        .notification-datetime {
            font-size: 12px;
            color: var(--color-text-muted);
            font-weight: 600;
        }

        /* META & RELATIVE TIME */
        .notification-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            margin-left: auto;
        }

        .relative-time {
            font-size: 12px;
            color: var(--color-text-muted);
            font-weight: 500;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--color-occupied);
        }

        .notification-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .badge-high { background: #fbbf24; color: #78350f; }
        .badge-urgent { background: #ef4444; color: #ffffff; }
        .badge-normal { background: #818cf8; color: #ffffff; }
        .badge-low { background: #9ca3af; color: #ffffff; }

        .empty-notifications {
            text-align: center;
            padding: 80px 20px;
            background: var(--color-panel-bg);
            border-radius: 16px;
            border: 1px solid var(--color-border);
        }

        .empty-notifications svg {
            margin-bottom: 24px;
            opacity: 0.4;
            color: var(--color-text-muted);
        }

        .empty-notifications h3 {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-dark);
            margin-bottom: 8px;
        }

        .empty-notifications p {
            font-size: 14px;
            color: var(--color-text-muted);
        }
        
        /* GROUP HEADER */
        .group-header {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-text-muted);
            margin: 24px 0 12px 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* FILTER SECTION */
        .notifications-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            background: var(--color-panel-bg);
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid var(--color-border);
            gap: 16px;
        }
        
        .search-container {
            position: relative;
            flex: 1;
            max-width: 300px;
        }
        
        .search-container svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-text-muted);
        }
        
        .search-container input {
            width: 100%;
            padding: 10px 10px 10px 36px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: var(--color-bg-light);
            transition: all 0.2s;
        }
        
        .search-container input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px var(--color-primary-bg);
            background: white;
        }
        
        .filter-tabs {
            display: flex;
            gap: 8px;
        }
        
        .filter-tab {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--color-border);
            background: transparent;
            color: var(--color-text-muted);
            transition: all 0.2s;
        }
        
        .filter-tab.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        /* Dark Mode */
        [data-theme="dark"] .notification-item:not(.unread) {
            background: var(--dark-bg-secondary);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        [data-theme="dark"] .notification-title {
            color: var(--dark-text-primary);
        }

        [data-theme="dark"] .notification-message,
        [data-theme="dark"] .notification-datetime,
        [data-theme="dark"] .relative-time {
            color: var(--dark-text-secondary);
        }
        
        [data-theme="dark"] .group-header {
            color: var(--dark-text-secondary);
        }
        
        [data-theme="dark"] .notifications-toolbar {
            background: var(--dark-bg-secondary);
            border-color: var(--dark-border);
        }
        
        [data-theme="dark"] .search-container input {
            background: var(--dark-bg-tertiary);
            border-color: var(--dark-border);
            color: var(--dark-text-primary);
        }
        
        [data-theme="dark"] .filter-tab {
            border-color: var(--dark-border);
            color: var(--dark-text-secondary);
        }
        
        [data-theme="dark"] .filter-tab.active {
            background: var(--color-primary);
            color: white;
            border-color: var(--color-primary);
        }

        [data-theme="dark"] .empty-notifications {
            background: var(--dark-bg-secondary);
            border-color: var(--dark-border);
        }

        [data-theme="dark"] .empty-notifications h3 {
            color: var(--dark-text-primary);
        }

        [data-theme="dark"] .btn-secondary {
            background: var(--dark-bg-tertiary);
            border-color: var(--dark-border);
            color: var(--dark-text-primary);
        }

        [data-theme="dark"] .btn-secondary:hover {
            background: rgba(239, 68, 68, 0.1);
        }
        
        .load-more-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--color-primary);
            color: white;
            text-align: center;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
            box-shadow: 0 4px 15px var(--color-shadow-hover);
        }
        
        .load-more-btn:hover {
            opacity: 0.9;
        }

        /* ── Notification Detail Modal ── */
        .notif-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .notif-modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .notif-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -48%) scale(0.96);
            width: min(540px, calc(100vw - 32px));
            background: var(--color-panel-bg);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18), 0 4px 16px rgba(15, 23, 42, 0.08);
            border: 1px solid var(--color-border);
            z-index: 901;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .notif-modal.open {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Header */
        .notif-modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 24px 24px 20px;
        }

        .notif-modal-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .notif-modal-header-left .notification-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            flex-shrink: 0;
        }

        .notif-modal-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--color-dark);
            line-height: 1.3;
            margin-bottom: 6px;
            word-break: break-word;
            background: none;
            -webkit-text-fill-color: unset;
        }

        .notif-type-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: white;
            white-space: nowrap;
        }

        .notif-modal-close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--color-border);
            background: var(--color-bg-light);
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .notif-modal-close:hover {
            background: var(--color-occupied-bg);
            border-color: var(--color-occupied);
            color: var(--color-occupied);
        }

        /* Divider */
        .notif-modal-divider {
            height: 1px;
            background: var(--color-border);
            margin: 0 24px;
        }

        /* Body */
        .notif-modal-body {
            padding: 20px 24px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .notif-detail-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .notif-detail-row.column {
            flex-direction: column;
            align-items: flex-start;
        }

        .notif-detail-label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 700;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            white-space: nowrap;
        }

        .notif-detail-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-dark);
            text-align: right;
        }

        .notif-detail-message {
            font-size: 14px;
            color: var(--color-text);
            line-height: 1.65;
            background: var(--color-bg-light);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 14px 16px;
            width: 100%;
            margin: 0;
        }

        /* Footer */
        .notif-modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--color-border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Active item highlight */
        .notification-item.active-detail {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        /* Dark mode */
        [data-theme="dark"] .notif-modal {
            background: var(--dark-bg-secondary);
            border-color: var(--dark-border);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        [data-theme="dark"] .notif-modal-title {
            color: var(--dark-text-primary);
        }

        [data-theme="dark"] .notif-modal-close {
            background: var(--dark-bg-tertiary);
            border-color: var(--dark-border);
            color: var(--dark-text-secondary);
        }

        [data-theme="dark"] .notif-modal-close:hover {
            background: rgba(248, 113, 113, 0.12);
            border-color: var(--color-occupied);
            color: var(--color-occupied);
        }

        [data-theme="dark"] .notif-modal-divider,
        [data-theme="dark"] .notif-modal-footer {
            border-color: var(--dark-border);
        }

        [data-theme="dark"] .notif-detail-value {
            color: var(--dark-text-primary);
        }

        [data-theme="dark"] .notif-detail-message {
            background: var(--dark-bg-tertiary);
            border-color: var(--dark-border);
            color: var(--dark-text-primary);
        }
        /* ── Full-page override (no sidebar) ── */
        body .main-content {
            margin-left: 0;
            width: 100%;
            max-width: 100%;
            padding: 40px 56px;
            height: 100vh;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            body .main-content {
                padding: 24px 20px;
            }

            .notifications-header {
                flex-wrap: wrap;
                gap: 16px;
            }

            .notifications-actions {
                flex-wrap: wrap;
            }

            .notifications-toolbar {
                flex-wrap: wrap;
            }

            .search-container {
                max-width: none;
                min-width: 180px;
            }
        }

        @media (max-width: 480px) {
            body .main-content {
                padding: 16px;
            }

            .notifications-header {
                margin-bottom: 20px;
            }

            .notifications-actions {
                width: 100%;
            }

            .notifications-actions button {
                flex: 1;
                justify-content: center;
                padding: 10px 12px;
            }

            .notifications-toolbar {
                margin-bottom: 12px;
                padding: 12px;
            }

            .filter-tabs {
                width: 100%;
                justify-content: space-between;
            }
        }

        /* Back button */
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: var(--color-panel-bg);
            color: var(--color-text);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            margin-bottom: 24px;
        }

        .btn-back:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
            background: var(--color-primary-bg);
            transform: translateX(-2px);
        }

        [data-theme="dark"] .btn-back {
            background: var(--dark-bg-secondary);
            border-color: var(--dark-border);
            color: var(--dark-text-primary);
        }

        [data-theme="dark"] .btn-back:hover {
            background: rgba(110, 231, 183, 0.08);
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Main Content (full page, no sidebar) -->
        <main class="main-content">
            <!-- Header -->
            <header class="notifications-header">
                <div>
                    <!-- Back Button -->
                    <button class="btn-back" onclick="history.back()" id="btn-back">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                        Back
                    </button>
                    <h1>Notifications</h1>
                    <p class="subtitle">Stay updated with system events and activities.</p>
                </div>
                <div class="notifications-actions">
                    <button onclick="markAllAsRead()" class="btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Mark All Read
                    </button>
                    <button onclick="clearAllRead()" class="btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                        Clear Read
                    </button>
                </div>
            </header>

            <!-- Notifications Toolbar (Search & Filter) — sticky, outside scroll area -->
            <div class="notifications-toolbar">
                <div class="search-container">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="notification-search" placeholder="Search notifications..." oninput="onSearchNotifications(this.value)">
                </div>
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="setNotificationFilter('all', this)">All</button>
                    <button class="filter-tab" onclick="setNotificationFilter('unread', this)">Unread</button>
                    <button class="filter-tab" onclick="setNotificationFilter('read', this)">Read</button>
                </div>
            </div>

            <div class="notifications-container">
                <!-- Notifications List -->
                <div id="notifications-container">
                    <div style="text-align: center; padding: 3rem; color: var(--color-text-muted);">
                        Loading notifications...
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Notification Detail Modal -->
    <div id="detail-overlay" class="notif-modal-overlay" onclick="closeDetailPane()"></div>

    <div id="notification-detail-pane" class="notif-modal" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <!-- Modal Header -->
        <div class="notif-modal-header">
            <div class="notif-modal-header-left">
                <div id="detail-icon" class="notification-icon"></div>
                <div>
                    <h2 id="detail-title" class="notif-modal-title"></h2>
                    <span id="detail-type-badge" class="notif-type-badge"></span>
                </div>
            </div>
            <button class="notif-modal-close" onclick="closeDetailPane()" aria-label="Close">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Divider -->
        <div class="notif-modal-divider"></div>

        <!-- Modal Body -->
        <div class="notif-modal-body">
            <!-- Date row -->
            <div class="notif-detail-row">
                <div class="notif-detail-label">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Date &amp; Time
                </div>
                <div id="detail-date" class="notif-detail-value"></div>
            </div>

            <!-- Message row -->
            <div class="notif-detail-row column">
                <div class="notif-detail-label">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Message
                </div>
                <p id="detail-message" class="notif-detail-message"></p>
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="notif-modal-footer">
            <button class="btn-secondary" onclick="closeDetailPane()">Close</button>
        </div>
    </div>

    <!-- Database Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/db-operations.js"></script>

        })();

        document.addEventListener('keydown', function(e) {
